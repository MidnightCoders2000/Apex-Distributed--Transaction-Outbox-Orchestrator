version: "3.8"

services:
  redis:
    image: redis:7
    ports:
      - "6379:6379"

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      # Two listeners: PLAINTEXT (kafka:9092) is what containers on the
      # apex_default network use (kafka-connect, and each other) — "kafka"
      # only resolves inside Docker. PLAINTEXT_HOST (localhost:29092) is for
      # Epic B3's mock consumers/producers, which run on the host via `mvn
      # spring-boot:run`, not in a container — without this, a host client's
      # initial bootstrap connection to localhost:9092 succeeds, but the
      # broker then advertises "kafka:9092" for the real data connection,
      # which the host can't resolve.
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    ports:
      - "9092:9092"
      - "29092:29092"

  kafka-connect:
    image: debezium/connect:2.7.3.Final
    depends_on:
      - kafka
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: 1
      CONFIG_STORAGE_TOPIC: apex_connect_configs
      OFFSET_STORAGE_TOPIC: apex_connect_offsets
      STATUS_STORAGE_TOPIC: apex_connect_status
      # Default is 60s, which lets confirmed_flush_lsn sit still that long
      # even under load. 5s keeps the replication slot's WAL retention
      # window tight, which is the whole point of Epic B2.
      OFFSET_FLUSH_INTERVAL_MS: 5000
    ports:
      - "8083:8083"

  postgres:
    image: postgres:16
    profiles: ["cdc-test"]
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_replication_slots=4", "-c", "max_wal_senders=4"]
    environment:
      POSTGRES_USER: apex
      POSTGRES_PASSWORD: apex
      POSTGRES_DB: apex
    ports:
      - "5433:5432"
