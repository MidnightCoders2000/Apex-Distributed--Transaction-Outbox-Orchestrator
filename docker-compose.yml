version: "3.8"

services:
  redis:
    image: redis:7
    ports:
      - "6379:6379"

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    ports:
      - "9092:9092"

  kafka-connect:
    image: debezium/connect:2.7.3.Final
    depends_on:
      - kafka
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: 1
      CONFIG_STORAGE_TOPIC: apex_connect_configs
      OFFSET_STORAGE_TOPIC: apex_connect_offsets
      STATUS_STORAGE_TOPIC: apex_connect_status
      # Default is 60s, which lets confirmed_flush_lsn sit still that long
      # even under load. 5s keeps the replication slot's WAL retention
      # window tight, which is the whole point of Epic B2.
      OFFSET_FLUSH_INTERVAL_MS: 5000
    ports:
      - "8083:8083"

  postgres:
    image: postgres:16
    profiles: ["cdc-test"]
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_replication_slots=4", "-c", "max_wal_senders=4"]
    environment:
      POSTGRES_USER: apex
      POSTGRES_PASSWORD: apex
      POSTGRES_DB: apex
    ports:
      - "5433:5432"
