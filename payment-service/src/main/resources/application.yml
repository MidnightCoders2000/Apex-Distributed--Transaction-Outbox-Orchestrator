spring:
  config:
    import: "optional:file:.env[.properties]"
  application:
    name: payment-service
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    # payment-service and shipment-service migrate the same shared Neon
    # "public" schema (each owns only its own table), so each needs its
    # own schema-history table -- otherwise Flyway would try to validate
    # the other service's migrations too and fail with "not resolved
    # locally". baseline-on-migrate is required because that schema
    # already has other services' tables in it (e.g. outbox_event), so
    # Flyway's "is this schema empty" check would otherwise refuse to run.
    table: payment_flyway_schema_history
    baseline-on-migrate: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    consumer:
      group-id: apex-payment-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false

apex:
  consumer:
    topic: apex.public.outbox_event
    event-type: PaymentRequested
    events-topic: apex.payment.events
    dlt-topic: apex.payment.events.DLT
  failure-injection:
    rate: ${PAYMENT_FAILURE_RATE:0.0}
    trigger-account-ids: ${PAYMENT_FAILURE_TRIGGER_ACCOUNT_IDS:}

server:
  port: 8081
