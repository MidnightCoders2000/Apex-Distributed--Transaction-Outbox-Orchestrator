name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # orchestrator-service is intentionally excluded here. Its own test
      # (TransactionServiceTest) hits a real external Postgres/Redis via
      # .env-style DB_URL/DB_USERNAME/DB_PASSWORD placeholders instead of
      # Testcontainers, so it has no way to start on a clean runner with no
      # real DB reachable -- see docs/integration-status-epic-a.md. It can
      # join this job once that test is switched to Testcontainers, matching
      # what payment-service/shipment-service's own *ApplicationTests
      # already do (a Testcontainers Postgres wired in via @ServiceConnection,
      # Kafka pointed at a closed port so context refresh needs no broker).
      - name: Build and test (common-events, common-messaging, payment-service, shipment-service)
        run: mvn -B -pl common-events,common-messaging,payment-service,shipment-service verify
